service: shailesh-weds-shubhangi
frameworkVersion: "3"
provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, "dev"}
  region: ${opt:region, "us-east-1"}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - "s3:*"
        - "s3:PutBucketPublicAccessBlock"
        - "s3:DeletePublicAccessBlock"
        - "s3:PutObject"
        - "s3:PutObjectAcl"
        - "s3:PutObjectTagging"
        - "cloudformation:*"
      Resource: "*"

custom:
  # Custom domain is attached to dev (the live site) only; other stages keep the default cloudfront.net URL
  domains:
    dev:
      - shaileshwedsshubhangi.in
      - www.shaileshwedsshubhangi.in
  certificates:
    dev: arn:aws:acm:us-east-1:149997402955:certificate/49de4548-f5f5-42cc-8c23-52d1b3e3f66e
  tlsVersions:
    dev: TLSv1.2_2021
  # CNAME from the ACM console (certificate > Domains, shared by both names); kept in Route 53 so the cert can auto-renew
  certValidation:
    name: _3d5bca3e9d5e04fbbcacac1fa19eb2f2.shaileshwedsshubhangi.in.
    value: _d2720a5c923c382463c427d6a8793500.wzccmgtwzk.acm-validations.aws.
  fullstack:
    domain: ${self:custom.domains.${self:provider.stage}, null}
    certificate: ${self:custom.certificates.${self:provider.stage}, null}
    minimumProtocolVersion: ${self:custom.tlsVersions.${self:provider.stage}, null}
    bucketName: ${self:service}
    distributionFolder: dist/shailesh-weds-shubhangi/browser
    indexDocument: index.html
    errorDocument: index.html
    singlePageApp: false
    compressWebContent:
    clientCommand: npm run build
    clientSrcPath: ./
    noConfirm: true
    invalidationPaths: /*
    spa:
      errorConfigurations:
        - errorCode: 404
          responseCode: 200
          responsePagePath: /index.html

resources:
  Conditions:
    IsDev: !Equals ["${sls:stage}", "dev"]
  Outputs:
    HostedZoneNameServers:
      Condition: IsDev
      Description: Set these as custom nameservers in GoDaddy
      Value: !Join [", ", !GetAtt HostedZone.NameServers]
  Resources:
    HostedZone:
      Type: AWS::Route53::HostedZone
      Condition: IsDev
      Properties:
        Name: ${self:custom.domains.dev.0}
    DomainRecords:
      Type: AWS::Route53::RecordSetGroup
      Condition: IsDev
      Properties:
        HostedZoneId: !Ref HostedZone
        RecordSets:
          - Name: ${self:custom.domains.dev.0}
            Type: A
            AliasTarget: &cloudfrontAlias
              DNSName: !GetAtt ApiDistribution.DomainName
              HostedZoneId: Z2FDTNDATAQYW2 # fixed hosted zone id for all CloudFront aliases
          - Name: ${self:custom.domains.dev.0}
            Type: AAAA
            AliasTarget: *cloudfrontAlias
          - Name: ${self:custom.domains.dev.1}
            Type: A
            AliasTarget: *cloudfrontAlias
          - Name: ${self:custom.domains.dev.1}
            Type: AAAA
            AliasTarget: *cloudfrontAlias
          - Name: ${self:custom.certValidation.name}
            Type: CNAME
            TTL: "300"
            ResourceRecords:
              - ${self:custom.certValidation.value}
    OriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: !Sub shailesh-weds-shubhangi Website
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-${self:service}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: FALSE
          BlockPublicPolicy: FALSE
          IgnorePublicAcls: FALSE
          RestrictPublicBuckets: FALSE
  extensions:
    WebAppS3BucketPolicy:
      Properties:
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Join
                - ""
                - - !GetAtt WebAppS3Bucket.Arn
                  - "/*"
              Principal:
                CanonicalUser: !GetAtt OriginAccessIdentity.S3CanonicalUserId
                AWS: "*"

plugins:
  - fullstack-serverless

package:
  individually: true
  exclude:
    - src/**
    - tsconfig.spec.json
    - tsconfig.json
    - README.md
    - ILLUSTRATION_PROMPTS.md
    - angular.json
    - package-lock.json
    - package.json
    - tsconfig.app.json
    - node_modules/**
    - .angular/**
    - .github/**
    - .vscode/**
    - .editorconfig
